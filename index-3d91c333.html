:root{--bg:#000;--fg:#d9776f;--accent:#b3261e;--card:#140808;--line:#3a1512;--onacc:#000;--ok:#7a2a25}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Naskh Arabic","Noto Sans Arabic","Droid Arabic Naskh",Tahoma,Arial,sans-serif;font-size:18px;line-height:1.5}
body{padding-bottom:calc(182px + env(safe-area-inset-bottom));min-height:100vh}
button{font-family:inherit;font-size:20px;color:var(--fg);background:var(--card);border:2px solid var(--line);border-radius:16px;min-height:56px;padding:0 14px;cursor:pointer}
button:active{filter:brightness(1.5)}
.top{padding:6px 10px 6px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar h1{font-size:17px;margin:0;white-space:nowrap}
.bar button{min-height:36px;font-size:13px;border-radius:10px;padding:0 8px}
.count{text-align:center;font-size:34px;font-weight:700;line-height:1.05;color:var(--accent);flex:none;min-width:96px}
.count small{font-size:20px;color:var(--fg);opacity:.8}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
.prog{height:7px;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.prog>div{height:100%;width:0;background:var(--accent);transition:width .2s;margin-right:0;margin-left:auto}
.done .count{color:#4cd37b}.done .prog>div{background:#4cd37b}
.donebadge{display:none;text-align:center;font-size:30px;font-weight:700;color:#4cd37b}
.done .donebadge{display:block}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;flex:1}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;text-align:center;padding:4px 2px}
.stat b{display:block;font-size:18px;color:var(--accent);line-height:1.2}
.stat span{font-size:11px;opacity:.9;white-space:nowrap}
#live{min-height:0;padding:0 12px;font-size:14px;opacity:.8}
.nav{display:flex;gap:4px;margin-top:5px}
.nav button{flex:1;min-height:38px;font-size:14px;padding:0 2px;border-radius:10px;border-width:1px;position:relative;line-height:1.1}
.nav button.sel{background:var(--accent);color:var(--onacc);border-color:var(--accent);font-weight:700}
.nav button.gen{border-style:dashed}
.nav button i{position:absolute;top:2px;left:4px;width:6px;height:6px;border-radius:50%;background:#4cd37b}
.sumrow{display:flex;gap:6px;align-items:center;margin-top:5px}
.where{font-size:12px;font-weight:400;color:var(--fg);opacity:.85;line-height:1.2}
#heard{display:flex;align-items:center;gap:8px;margin-top:5px;padding:3px 10px;border-radius:12px;border:2px solid var(--accent);min-height:44px}
#heard .hl{font-size:15px;opacity:.9}
#heard .hv{font-size:30px;font-weight:700;color:var(--accent);min-width:64px;text-align:center}
#heard #hSt{font-size:14px;flex:1;text-align:left;opacity:.9}
#heard.ok{background:rgba(76,211,123,.14)}#heard.bad{background:rgba(176,0,32,.35)}#heard.wait{background:rgba(240,180,0,.2)}
#list{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px 10px}
#list .empty{grid-column:1/-1}
.chip{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px;min-height:52px}
.chip .cw{flex:1;text-align:center;line-height:1.1;min-width:0}.chip .cw b{display:block;font-size:20px;color:var(--accent)}.chip .cw span{font-size:14px}
.chip button{width:30px;min-width:30px;height:46px;min-height:0;font-size:22px;padding:0;border-radius:9px;border-width:1px}
.chip.ro{justify-content:center;padding:4px}
.chip.pl{background:var(--accent);border-color:var(--accent)}.chip.pl .cw b,.chip.pl .cw span{color:var(--onacc)}
#agg{padding:6px 10px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td.num{display:table-cell}
.tbl th,.tbl td{border:1px solid var(--line);padding:5px 3px;text-align:center}
.tbl th{background:var(--card);font-size:12px;font-weight:700}.tbl td b{color:var(--accent)}
.tbl tr.tot td{font-weight:700;background:var(--card)}
body.agg #go,body.agg #bUndo,body.agg #bAdd,body.agg #bReset,body.agg #heard,body.agg #bTas,body.agg #live{display:none!important}
.ronote{font-size:13px;opacity:.8;text-align:center;margin:6px 0}
.credit{margin:6px 12px 8px;text-align:center;font-size:11px;line-height:1.4;opacity:.55}.credit b{font-weight:600}.credit small{font-size:11px;margin-inline-start:6px}
#ask{display:none;margin:4px 12px;padding:10px;border-radius:12px;background:#33290a;border:2px solid #f0b400;color:#fff;font-size:18px;text-align:center}#ask .ab{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center}#ask button{min-height:48px;font-size:20px;padding:0 14px;border-radius:12px;flex:1}
#alert{display:none;margin:4px 12px;padding:10px;border-radius:12px;background:#b00020;color:#fff;font-size:22px;font-weight:700;text-align:center}
#msg{display:none;margin:6px 12px;padding:12px;border-radius:12px;border:2px solid #e0a000;background:#2a2000;color:#ffd666;font-size:18px}
.light #msg{background:#fff3cd;color:#5a4300}
.row{display:flex;align-items:center;gap:8px;margin:6px 12px;padding:6px 10px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.row .w{font-size:30px;font-weight:700;min-width:84px;color:var(--accent)}
.row .t{flex:1;display:flex;flex-wrap:wrap;gap:0 2px;font-size:17px;align-items:center}

function normText(s){
  s=String(s||'');

  s=s.replace(/[\u06F0-\u06F9]/g,function(d){return d.charCodeAt(0)-0x6F0;});

function lowP(v){return v%10?1:(v%100?2:(v%1000?3:4));}
function highP(v){return v>=1000?4:(v>=100?3:(v>=10?2:1));}
function lookup(t){
  if(/^[0-9]+$/.test(t)){return {v:parseInt(t,10),kind:'d'};}
  if(WORDS.hasOwnProperty(t)){var v=WORDS[t];
    if(v===500.5)return {v:500,kind:'half'};
    return {v:v,kind:(v>=100&&v<1000)?'h':(v>=20&&v<100?'ten':'w'),isMia:(v===100)};}
  return null;
}
function parseNumbers(text){
  var toks=normText(text).split(' '),res=[],cur=null,and=false;
  function flush(){if(cur){res.push(cur.v);cur=null;}}
  for(var i=0;i<toks.length;i++){
    var t=toks[i];if(!t)continue;
    if(t==='\u0648'){and=true;continue;}
    var hasAnd=and;and=false;
    var tk=lookup(t);
    if(!tk&&t.charAt(0)==='\u0648'&&t.length>1){var r=lookup(t.slice(1));if(r){tk=r;hasAnd=true;}}
    if(!tk){flush();continue;}
    if(cur&&cur.v===1&&tk.v===1000&&!hasAnd){cur=null;}
    if(cur){
      var ok=false;
      if(hasAnd&&highP(tk.v)<lowP(cur.v)){cur.v+=tk.v;ok=true;}
      else if(hasAnd&&cur.v>=1&&cur.v<=9&&cur.kind==='w'&&tk.kind==='ten'){cur.v+=tk.v;ok=true;}
      else if(hasAnd&&cur.v>=101&&cur.v%100>=1&&cur.v%100<=9&&tk.kind==='ten'){cur.v+=tk.v;ok=true;}
      else if(!hasAnd&&cur.kind==='w'&&cur.v>=1000&&cur.v%1000===0&&tk.v<1000&&tk.v>0&&(tk.kind==='h'||tk.kind==='ten'||tk.kind==='d')){cur.v+=tk.v;ok=true;}
      else if(!hasAnd&&cur.v>=2&&cur.v<=9&&cur.kind==='w'&&tk.isMia){cur.v*=100;cur.kind='h';ok=true;}
      if(ok){continue;}
      flush();
    }
    if(tk.kind==='half')continue;
    cur={v:tk.v,kind:tk.kind};
  }
  flush();
  return res;
}

function calcStats(counts,target){
  var n=0,sum=0,k;
  for(k in counts){var c=counts[k];n+=c;sum+=(+k)*c;}
  var out={n:n,avg:null,uni:null,cv:null,rem:Math.max(0,target-n)};
  if(n>0){
    var m=sum/n,ss=0,inb=0;
    for(k in counts){var c2=counts[k],w=+k;ss+=c2*(w-m)*(w-m);if(Math.abs(w-m)<=0.1*m)inb+=c2;}
    out.avg=m;out.uni=inb/n*100;
    out.cv=n>1?Math.sqrt(ss/(n-1))/m*100:0;
  }
  return out;
}

function makeRec(){

    }else if(er==='not-allowed'||er==='service-not-allowed'){

    }else if(er==='audio-capture'){
      fatal('<b>مش لاقي ميكروفون شغال.</b><br>اتأكد إن الميكروفون شغال ومفيش تطبيق تاني بيستخدمه، وبعدين جرب تاني.');
    }else if(er==='network'){

  if(s.n){L.push('المتوسط: '+fmt(s.avg,0));L.push('التجانس: '+fmt(s.uni,0)+'٪');L.push('معامل الاختلاف: '+fmt(s.cv,1)+'٪');}
  if(penView())L.push('المتبقي: '+s.rem);
  L.push('','الوزن : العدد');
  ks.forEach(function(w){L.push(w+' : '+counts[w]);});
  return L.join('\n');
}
$('bCopy').onclick=function(){

/* full export (CSV, opens in Excel / Google Sheets) */
function csvCell(x){x=String(x==null?'':x);if(/[",\r\n]/.test(x))x='"'+x.replace(/"/g,'""')+'"';return x;}
function r1(x){return x===null?'':(Math.round(x*10)/10);}
function sumRow(level,h,p,keys){
  var c=mergeKeys(keys),s=calcStats(c,0),ks=Object.keys(c).map(Number);
  return [level,h,p,s.n,s.n?r1(s.avg):'',s.n?r1(s.cv):'',s.n?r1(s.uni):'',ks.length?Math.min.apply(null,ks):'',ks.length?Math.max.apply(null,ks):''];
}
function buildCSV(){
  var L=[],d=new Date(),pad=function(n){return (n<10?'0':'')+n;};
  var stamp=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  L.push(['تقرير أوزان المحطة']);L.push(['تاريخ التصدير',stamp]);
  L.push(['جدول الأوزان',st.settings.min+' إلى '+st.settings.max+' خطوة '+st.settings.step]);L.push([]);
  L.push(['الملخص (الأرقام محسوبة من الأوزان المسجلة مباشرة وليس من متوسطات المتوسطات)']);
  L.push(['المستوى','العنبر','الحجازة','العدد','متوسط الوزن','معامل الاختلاف %','التجانس ±10% %','أقل وزن','أعلى وزن']);
  var h,p;
  for(h=1;h<=5;h++)for(p=1;p<=penCount(h);p++)L.push(sumRow('حجازة',h===5?'ذكور':h,p,[h+'-'+p]));
  for(h=1;h<=5;h++)L.push(sumRow('عام العنبر',h===5?'ذكور':h,'',penKeys(h)));
  L.push(sumRow('عام الإناث','','',fKeys()));L.push(sumRow('عام الذكور','','',mKeys()));
  L.push(sumRow('عام المحطة (إناث وذكور)','','',allKeys()));L.push([]);
  L.push(['توزيع الأوزان (عدد الطيور لكل وزن)']);
  var keys=allKeys(),hd=['الوزن'];keys.forEach(function(k){var a=k.split('-');hd.push((a[0]==='5'?'عنبر الذكور':'عنبر '+a[0])+' ح'+a[1]);});hd.push('الإجمالي');L.push(hd);
  var all=mergeKeys(keys);
  Object.keys(all).map(Number).sort(function(a,b){return a-b;}).forEach(function(w){
    var row=[w];keys.forEach(function(k){row.push(st.pens[k].counts[w]||'');});row.push(all[w]);L.push(row);});
  L.push([]);L.push(['الأوزان بترتيب التسجيل']);L.push(['عنبر','حجازة','رقم الطائر','الوزن','ملاحظة']);
  keys.forEach(function(k){
    var a=k.split('-'),pen=st.pens[k],seq=pen.hist.slice(),chk={};
    seq.forEach(function(w){chk[w]=(chk[w]||0)+1;});
    var okSeq=JSON.stringify(Object.keys(chk).sort())===JSON.stringify(Object.keys(pen.counts).sort())&&Object.keys(chk).every(function(w){return chk[w]===pen.counts[w];});
    var note='';
    if(!okSeq){seq=[];Object.keys(pen.counts).map(Number).sort(function(x,y){return x-y;}).forEach(function(w){for(var i=0;i<pen.counts[w];i++)seq.push(w);});note='ترتيب التسجيل غير متاح، مرتبة بالوزن';}
    seq.forEach(function(w,i){L.push([a[0]==='5'?'ذكور':a[0],a[1],i+1,w,i===0?note:'']);});
  });
  return {text:L.map(function(r){return r.map(csvCell).join(',');}).join('\r\n'),stamp:stamp};
}
$('bExp').onclick=function(){
  var o=buildCSV(),n=nOf(allKeys());
  if(!n){toast('مفيش أوزان مسجلة تتصدّر لسه');return;}
  var name='station-weights-'+o.stamp.replace(/[: ]/g,function(c){return c===' '?'_':'-';})+'.csv';
  try{
    var blob=new Blob(['\ufeff'+o.text],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(a.href);},2000);
    toast('تم تجهيز الملف: '+name);
  }catch(e){toast('تعذر إنشاء الملف');}
};
/* themes */
function buildSw(){
  var h='';
  Object.keys(THEMES).forEach(function(k){var t=THEMES[k];
    var acc=(k==='custom'&&st.accent)?st.accent:t.accent,bg=t.bg,fg=t.fg;
    if(k==='custom'){var cp=customPalette(acc,!!st.cl);bg=cp.bg;fg=cp.accent;acc=cp.accent;}
    h+='<button data-k="'+k+'" class="'+(st.theme===k?'sel':'')+'" style="background:'+bg+';color:'+(k==='custom'?fg:t.fg)+';border-color:'+acc+'">'+t.n+'</button>';});

$('bTheme').onclick=function(){buildSw();$('iColor').value=st.accent||THEMES[st.theme].accent;open('mTheme');window.__wheelSync();};
$('swatches').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;st.theme=b.dataset.k;if(st.theme!=='custom')st.accent=null;save();applyTheme();buildSw();$('iColor').value=st.accent||THEMES[st.theme].accent;window.__wheelSync();});
$('iColor').addEventListener('input',function(){st.accent=this.value;if(st.theme!=='custom'&&st.theme!=='light')st.theme='custom';save();applyTheme();buildSw();});

/* color wheel */
(function(){
var cv=$('wheel'),ctx=cv.getContext('2d'),W=cv.width,R=W/2,hue=210,sat=0.8,val=0.9;
function hsv2rgb(h,s,v){var c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c,r=0,g=0,b=0;if(h<60){r=c;g=x;}else if(h<120){r=x;g=c;}else if(h<180){g=c;b=x;}else if(h<240){g=x;b=c;}else if(h<300){r=x;b=c;}else{r=c;b=x;}return [(r+m)*255,(g+m)*255,(b+m)*255];}
function draw(){var im=ctx.createImageData(W,W),d=im.data,x,y;for(y=0;y<W;y++)for(x=0;x<W;x++){var dx=x-R+.5,dy=y-R+.5,rr=Math.sqrt(dx*dx+dy*dy),i=(y*W+x)*4;if(rr<=R-1){var a=Math.atan2(dy,dx)*180/Math.PI;if(a<0)a+=360;var c=hsv2rgb(a,Math.min(1,rr/(R-1)),val);d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255;}else d[i+3]=0;}ctx.putImageData(im,0,0);}
function curHex(){return r2h(hsv2rgb(hue,sat,val));}
function mark(){var m=$('wmark'),box=cv.getBoundingClientRect(),k=box.width/W,a=hue*Math.PI/180;m.style.left=(R+Math.cos(a)*sat*(R-1))*k+'px';m.style.top=(R+Math.sin(a)*sat*(R-1))*k+'px';m.style.background=curHex();}
function apply(){var hx=curHex();st.accent=hx;if(st.theme!=='light')st.theme='custom';save();applyTheme();buildSw();$('wHex').textContent=hx;$('wDot').style.background=hx;mark();$('wDark').classList.toggle('sel',!st.cl);$('wLight').classList.toggle('sel',!!st.cl);}
function from(e){var box=cv.getBoundingClientRect(),k=W/box.width,dx=(e.clientX-box.left)*k-R,dy=(e.clientY-box.top)*k-R,rr=Math.sqrt(dx*dx+dy*dy);var a=Math.atan2(dy,dx)*180/Math.PI;if(a<0)a+=360;hue=a;sat=Math.min(1,rr/(R-1));apply();}
var down=false;
cv.addEventListener('pointerdown',function(e){down=true;try{cv.setPointerCapture(e.pointerId);}catch(x){}from(e);e.preventDefault();});
cv.addEventListener('pointermove',function(e){if(down)from(e);});
cv.addEventListener('pointerup',function(){down=false;});cv.addEventListener('pointercancel',function(){down=false;});
$('wV').addEventListener('input',function(){val=this.value/100;draw();apply();});
$('wDark').onclick=function(){st.cl=false;if(st.theme!=='light')st.theme='custom';save();applyTheme();apply();};
$('wLight').onclick=function(){st.cl=true;st.theme='custom';save();applyTheme();apply();};
window.__wheelSync=function(){var hex=st.accent||THEMES[st.theme].accent,c=h2r(hex),mx=Math.max(c[0],c[1],c[2]),mn=Math.min(c[0],c[1],c[2]);val=Math.max(.25,mx/255);sat=mx?(mx-mn)/mx:0;hue=r2hsl(c)[0];$('wV').value=Math.round(val*100);draw();$('wHex').textContent=hex;$('wDot').style.background=hex;mark();$('wDark').classList.toggle('sel',!st.cl);$('wLight').classList.toggle('sel',!!st.cl);};
})();
$('themeOk').onclick=function(){close('mTheme');};


/* tasbih */
var draft={},tstep=20;
function tRange(){var a=parseInt(normText($('tFrom').value),10),b=parseInt(normText($('tTo').value),10);return [a,b];}
function tWeights(){var r=tRange(),a=r[0],b=r[1],o=[];if(!(a>=0)||!(b>=a))return o;for(var w=a;w<=b&&o.length<500;w+=tstep)o.push(w);return o;}
function tTotal(){var n=0;for(var k in draft)n+=draft[k];return n;}
function tBuild(){
  var ws=tWeights(),h='';
  var L=document.body.classList.contains('light')?45:58;
  var groups=[],gi={};
  ws.forEach(function(w){var g=Math.floor(w/100);if(!(g in gi)){gi[g]=groups.length;groups.push([]);}groups[gi[g]].push(w);});
  var m=1;groups.forEach(function(g){if(g.length>m)m=g.length;});
  var maxCols=(window.innerWidth>=700&&window.innerHeight>=520)?Math.max(1,groups.length):6,bands=Math.max(1,Math.ceil(groups.length/maxCols)),per=Math.max(1,Math.ceil(groups.length/bands));
  var tb=$('tBody'),rt=[],bi;
  tb.style.gridTemplateColumns='repeat('+per+',1fr)';
  for(bi=0;bi<bands;bi++){if(bi)rt.push('8px');rt.push('repeat('+m+',minmax(0,1fr))');}
  tb.style.gridTemplateRows=rt.join(' ');
  var rowOf=function(bn,j){return bn*(m+1)+j+1;};
  groups.forEach(function(g,k){var bn=Math.floor(k/per),col=k%per+1;
    g.forEach(function(w,j){var c=draft[w]||0,sty=' style="grid-column:'+col+';grid-row:'+rowOf(bn,j);
      var cls='tcell'+(c?' on':'');
      if(w%100===0){var hue=((w/100-1)*33)%360;cls+=' hun';sty+=';--hf:hsl('+hue+' 85% '+L+'%)';}
      sty+='"';
      h+='<div class="'+cls+'" data-w="'+w+'"'+sty+'><span class="w num">'+w+'</span><span class="c num">'+c+'</span><button class="mn" data-d="-1" aria-label="نقص">−</button></div>';});});
  if(!ws.length)h='<div class="empty">اكتب أقل وزن وأعلى وزن.</div>';
  tb.innerHTML=h;tUpd();
}
function tUpd(){$('tTot').textContent=tTotal();$('tTgt').textContent=st.settings.target;}
function tOpen(){
  draft={};for(var k in st.counts)draft[k]=st.counts[k];
  tstep=st.settings.step>0?st.settings.step:20;
  $('tFrom').value=st.settings.min;$('tTo').value=st.settings.max;
  $('tWhere').textContent=viewLabel()+' -';tBuild();$('tas').classList.add('show');
}
$('bTas').onclick=function(){if(penView())tOpen();};
window.addEventListener('resize',function(){if($('tas').classList.contains('show'))tBuild();});$('tFrom').addEventListener('change',tBuild);$('tTo').addEventListener('change',tBuild);
$('tBody').addEventListener('click',function(e){
  var row=e.target.closest('.tcell');if(!row)return;var b=e.target.closest('button');
  var w=+row.dataset.w,d=b?-1:1;
  var c=(draft[w]||0)+d;if(c<0)return;
  if(c)draft[w]=c;else delete draft[w];
  row.querySelector('.c').textContent=c;row.classList.toggle('on',c>0);tUpd();buzz();
});
$('tBack').onclick=function(){$('tas').classList.remove('show');};
$('tDone').onclick=function(){
  var r=tRange();
  /* keep range in settings if valid */
  if(r[0]>=0&&r[1]>r[0]){st.settings.min=r[0];st.settings.max=r[1];}
  Object.keys(draft).forEach(function(k){var w=+k;if(!isFinite(w))delete draft[k];});
  var all={};Object.keys(st.counts).forEach(function(k){all[k]=1;});Object.keys(draft).forEach(function(k){all[k]=1;});
  Object.keys(all).forEach(function(k){
    var w=+k,old=st.counts[w]||0,nw=draft[w]||0,i;
    for(i=old;i<nw;i++)st.hist.push(w);
    for(i=old;i>nw;i--){var j=st.hist.lastIndexOf(w);if(j>=0)st.hist.splice(j,1);}
  });
  st.counts={};Object.keys(draft).forEach(function(k){if(draft[k]>0)st.counts[+k]=draft[k];});
  save();render();
  var s=calcStats(st.counts,st.settings.target);
  $('sumBody').innerHTML=
   '<div class="sumr"><span>العدد</span><b class="num">'+s.n+' من '+st.settings.target+'</b></div>'+
   '<div class="sumr"><span>المتوسط</span><b class="num">'+fmt(s.avg,0)+'</b></div>'+
   '<div class="sumr"><span>التجانس ±١٠٪</span><b class="num">'+(s.uni===null?'-':fmt(s.uni,0)+'٪')+'</b></div>'+
   '<div class="sumr"><span>معامل الاختلاف</span><b class="num">'+(s.cv===null?'-':fmt(s.cv,1)+'٪')+'</b></div>'+
   '<div class="sumr"><span>المتبقي</span><b class="num">'+s.rem+'</b></div>';
  $('tas').classList.remove('show');open('mSum');
};
$('sumOk').onclick=function(){close('mSum');};

window.__app={st:st,handleText:handleText,render:render};
